<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dashboard Cloud | Mahika Trans</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0066ff;
            --dark: #0f172a;
            --bg: #f8fafc;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 100px;
        }

        /* Header Section */
        .header {
            background: var(--dark);
            color: var(--white);
            padding: 50px 20px 70px;
            text-align: center;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header h1 span {
            color: var(--primary);
        }

        .header p {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Main Container */
        .container {
            max-width: 500px;
            margin: -45px auto 0;
            padding: 0 18px;
        }

        .card {
            background: var(--white);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
        }

        /* Search Bar */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        .search-box input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0,102,255,0.1);
        }

        /* File List Area */
        #f-list {
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        /* Upload Area */
        .upload-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 18px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: #f8fafc;
            transition: 0.3s;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .upload-zone i {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .upload-zone p {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
        }

        .btn-upload {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 102, 255, 0.25);
            transition: 0.2s;
        }

        .btn-upload:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* Footer Buttons */
        .action-footer {
            margin-top: 25px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-switch {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            padding: 10px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 12px;
            transition: 0.4s ease-in-out;
            z-index: 9999;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .toast.show {
            bottom: 30px;
        }

        /* Scrollbar Style */
        #f-list::-webkit-scrollbar { width: 4px; }
        #f-list::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>MAHIKA<span>TRANS</span></h1>
        <p>Google Drive Cloud Management</p>
    </div>

    <div class="container">
        <div class="card">
            
            <div id="v-list">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="sInp" placeholder="Cari nama file...">
                </div>
                <div id="f-list">
                    </div>
            </div>

            <div id="v-up" style="display:none;">
                <div class="upload-zone" onclick="document.getElementById('fileI').click()">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p id="l-file">Ketuk untuk memilih file</p>
                    <input type="file" id="fileI" hidden>
                </div>
                <button class="btn-upload" id="btnU">MULAI UPLOAD</button>
            </div>

        </div>

        <div class="action-footer">
            <button onclick="toggleV()" id="btnT" class="btn-switch">[ + Upload File Baru ]</button>
        </div>
    </div>

    <div id="toast" class="toast">Pesan sistem</div>

    <script src="pdf.js"></script>

</body>
    </html>
