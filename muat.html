<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #0066ff; --d: #0f172a; --bg: #f8fafc; }
        * { box-sizing: border-box; margin:0; padding:0; font-family: sans-serif; }
        body { background: var(--bg); color: #1e293b; }
        .head { background: var(--d); color: #fff; padding: 40px 20px 60px; text-align: center; border-radius: 0 0 30px 30px; }
        .cont { max-width: 500px; margin: -40px auto 100px; padding: 0 15px; }
        .card { background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .search { position: relative; margin-bottom: 15px; }
        .search input { width: 100%; padding: 12px 12px 12px 40px; border: 1.5px solid #eee; border-radius: 10px; outline: none; }
        .search i { position: absolute; left: 15px; top: 14px; color: #aaa; }
        .f-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #f8f8f8; gap: 10px; }
        .f-info { flex: 1; min-width: 0; }
        .f-name { display: block; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .f-size { font-size: 10px; color: #888; }
        .btn-i { border: none; background: #f1f5f9; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; color: #64748b; }
        .up-box { border: 2px dashed #ccc; padding: 30px; border-radius: 15px; text-align: center; cursor: pointer; }
        .btn-up { width: 100%; background: var(--p); color: #fff; border: none; padding: 15px; border-radius: 12px; font-weight: 700; margin-top: 15px; cursor: pointer; }
        .toast { position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 12px; transition: 0.4s; z-index: 999; }
        .toast.show { bottom: 30px; }
        .nav-btn { display: block; width: 100%; text-align: center; background: none; border: none; color: var(--p); font-weight: 800; padding: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="head">
        <h2>MAHIKA<span style="color:var(--p)">TRANS</span></h2>
        <p style="font-size:10px; opacity:0.6; letter-spacing:2px;">DRIVE STORAGE</p>
    </div>
    <div class="cont">
        <div class="card">
            <div id="v-list">
                <div class="search"><i class="fa-solid fa-search"></i><input type="text" id="sInp" placeholder="Cari file..."></div>
                <div id="f-list"></div>
            </div>
            <div id="v-up" style="display:none;">
                <div class="up-box" onclick="document.getElementById('fileI').click()">
                    <i class="fa-solid fa-cloud-upload" style="font-size:30px; color:var(--p)"></i>
                    <p id="l-file" style="font-size:12px; margin-top:10px;">Pilih File</p>
                    <input type="file" id="fileI" hidden>
                </div>
                <button class="btn-up" id="btnU">UPLOAD</button>
            </div>
        </div>
        <button onclick="toggleV()" id="btnT" class="nav-btn">[ Panel Upload ]</button>
    </div>
    <div id="toast" class="toast"></div>
    <script src="pd.js"></script>
</body>
</html>
