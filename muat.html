<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dashboard | Mahika Trans</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0066ff; --dark: #0f172a; --bg: #f8fafc; --text: #1e293b; --sub: #64748b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .top-section { background: var(--dark); color: white; padding: 40px 20px 60px; text-align: center; border-radius: 0 0 30px 30px; }
        .brand-mahika { color: var(--primary); }
        .main-container { max-width: 500px; margin: -40px auto 100px; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .input-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 15px; }
        .input-wrapper i { position: absolute; left: 15px; color: var(--sub); }
        .input-wrapper input { width: 100%; padding: 12px 12px 12px 45px; border: 1.5px solid #e2e8f0; border-radius: 12px; outline: none; }
        .file-row { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #f1f5f9; gap: 10px; }
        .file-info { flex: 1; min-width: 0; }
        .file-name { display: block; font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-meta { font-size: 10px; color: var(--sub); }
        .btn-action { border: none; background: #f1f5f9; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: var(--sub); }
        .btn-action:hover { background: #e2e8f0; color: var(--primary); }
        .upload-box { border: 2px dashed #cbd5e1; padding: 30px; border-radius: 15px; text-align: center; cursor: pointer; background: #f8fafc; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 700; margin-top: 15px; cursor: pointer; }
        .btn-toggle { background: none; border: none; color: var(--primary); font-weight: 800; padding: 20px; width: 100%; cursor: pointer; }
        .btn-wa { text-decoration: none; background: #25d366; color: white; padding: 12px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; }
        .toast { position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 10px 20px; border-radius: 50px; font-size: 12px; transition: 0.4s; z-index: 1000; }
        .toast.show { bottom: 30px; }
    </style>
</head>
<body>
    <div class="top-section">
        <h1 style="font-size: 24px;">MAHIKA<span class="brand-mahika">TRANS</span></h1>
        <p style="font-size: 10px; opacity: 0.7; letter-spacing: 2px;">CLOUD MANAGEMENT</p>
    </div>
    <div class="main-container">
        <div class="card">
            <div id="home-view">
                <div class="input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Cari file...">
                </div>
                <div id="file-list"></div>
            </div>
            <div id="upload-view" style="display:none;">
                <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 30px; color: var(--primary);"></i>
                    <p id="file-label" style="font-size: 12px; margin-top: 10px;">Ketuk untuk pilih file</p>
                    <input type="file" id="fileInput" hidden>
                </div>
                <button class="btn-main" id="uploadBtn">UPLOAD KE CLOUD</button>
            </div>
        </div>
        <button onclick="toggleUpload()" id="btnT" class="btn-toggle">[ Panel Upload ]</button>
        <a href="https://wa.me/628123456789" class="btn-wa"><i class="fa-brands fa-whatsapp"></i> HUBUNGI ADMIN</a>
    </div>
    <div id="toast" class="toast"></div>
    <script src="apz.js"></script>
</body>
</html>
