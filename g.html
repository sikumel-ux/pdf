<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sikumel GitHub Storage</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #0a1931;
            --gold: #ffc947;
            --bg-body: #f8fafc;
        }

        body { 
            background-color: var(--bg-body); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; padding: 0;
        }

        /* --- Header Curve --- */
        .header-curve {
            background-color: var(--navy);
            height: 300px;
            color: white;
            padding-top: 80px;
            text-align: center;
            border-bottom-left-radius: 50% 40px;
            border-bottom-right-radius: 50% 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .header-curve h2 { font-weight: 800; letter-spacing: 1.5px; font-size: 28px; }
        .header-curve h2 span { color: var(--gold); }
        .header-curve p { font-size: 12px; opacity: 0.8; letter-spacing: 1px; }

        /* --- Main Card --- */
        .main-container {
            margin-top: -110px;
            padding-bottom: 60px;
            padding-left: 20px;
            padding-right: 20px;
        }

        .main-card { 
            background: white; border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(10, 25, 49, 0.15); 
            padding: 30px 25px; max-width: 480px; margin: auto; 
        }

        .upload-zone { 
            border: 2px dashed #e2e8f0; padding: 30px; border-radius: 20px; 
            background: #fcfdfe; cursor: pointer; transition: 0.3s; 
        }
        
        .upload-zone:hover { border-color: var(--gold); background: #fffdf5; }
        
        .btn-gold {
            background-color: var(--gold); color: var(--navy); border: none;
            font-weight: 800; padding: 18px; border-radius: 20px; 
            width: 100%; box-shadow: 0 10px 25px rgba(255, 201, 71, 0.3);
            text-transform: uppercase; font-size: 14px;
        }

        /* --- List File --- */
        .file-row { 
            background: #ffffff; border-radius: 18px; padding: 14px; 
            margin-bottom: 12px; display: flex; align-items: center; 
            justify-content: space-between; border: 1px solid #f1f5f9;
        }

        .file-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .file-name { font-weight: 700; font-size: 13px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn-action {
            background: #f8fafc; border: none; color: var(--navy);
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
        }

        #loader { display: none; }
    </style>
</head>
<body>

<div class="header-curve">
    <h2>SIKUMEL <span>GITHUB</span></h2>
    <p><i class="fa-brands fa-github"></i> REPO: PDF / PATH: UPLOADS</p>
</div>

<div class="container main-container">
    <div class="main-card">
        
        <div class="upload-zone text-center mb-4" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-cloud-arrow-up fa-3x mb-3 text-muted"></i>
            <p id="fileLabel" class="mb-0 fw-bold text-muted small">Pilih file untuk diunggah</p>
            <input type="file" id="fileInput" hidden onchange="updateLabel()">
        </div>

        <button class="btn btn-gold mb-4" id="uploadBtn" onclick="uploadToGithub()">
            <span id="btnText">PUSH TO GITHUB</span>
            <div class="spinner-border spinner-border-sm" id="loader"></div>
        </button>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0" style="font-size: 14px;">Isi Folder /uploads</h6>
            <button class="btn btn-sm btn-light border" onclick="fetchGithubFiles()">
                <i class="fa-solid fa-rotate" id="refreshIcon"></i>
            </button>
        </div>

        <div id="fileListContainer">
            <p class="text-center text-muted py-4 small">Menghubungkan ke GitHub API...</p>
        </div>
        
    </div>
</div>

<script>
    // --- KONFIGURASI SESUAI DATA KAMU ---
    const GITHUB_CONFIG = {
        token: "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", 
        username: "sikumel-ux",
        repo: "pdf",
        path: "uploads"
    };

    function updateLabel() {
        const input = document.getElementById('fileInput');
        if (input.files[0]) document.getElementById('fileLabel').innerText = input.files[0].name;
    }

    async function uploadToGithub() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) return alert("Pilih file dulu, bro!");

        const btn = document.getElementById('uploadBtn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');

        btn.disabled = true; loader.style.display = "inline-block"; btnText.style.display = "none";

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async () => {
            const content = reader.result.split(',')[1]; 
            // Bersihkan nama file dari spasi dan karakter aneh
            const cleanFileName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}/${cleanFileName}`;

            try {
                const res = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GITHUB_CONFIG.token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Upload: ${cleanFileName}`,
                        content: content
                    })
                });

                if (res.ok) {
                    alert("Berhasil Push!");
                    fileInput.value = "";
                    document.getElementById('fileLabel').innerText = "Pilih file untuk diunggah";
                    fetchGithubFiles();
                } else {
                    const data = await res.json();
                    alert("Error: " + data.message);
                }
            } catch (e) {
                alert("Koneksi Error!");
            } finally {
                btn.disabled = false; loader.style.display = "none"; btnText.style.display = "inline-block";
            }
        };
        reader.readAsDataURL(file);
    }

    async function fetchGithubFiles() {
        const container = document.getElementById('fileListContainer');
        const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;

        try {
            const res = await fetch(url, {
                headers: { "Authorization": `token ${GITHUB_CONFIG.token}` }
            });
            
            if (res.status === 404) {
                container.innerHTML = `<p class="text-center text-muted py-4 small">Folder /uploads belum ada.<br>Upload file pertama untuk membuatnya.</p>`;
                return;
            }

            const data = await res.json();
            container.innerHTML = data.map(file => `
                <div class="file-row">
                    <div class="file-info">
                        <i class="fa-solid fa-file-pdf text-danger"></i>
                        <span class="file-name">${file.name}</span>
                    </div>
                    <div class="d-flex">
                        <a href="${file.html_url}" target="_blank" class="btn-action"><i class="fa-solid fa-eye"></i></a>
                        <button onclick="deleteFile('${file.path}', '${file.sha}')" class="btn-action text-danger ms-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = `<p class="text-center text-danger py-4 small">Gagal muat data.</p>`;
        }
    }

    async function deleteFile(path, sha) {
        if (!confirm("Hapus file?")) return;
        const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${path}`;
        
        const res = await fetch(url, {
            method: "DELETE",
            headers: {
                "Authorization": `token ${GITHUB_CONFIG.token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: "Delete file", sha: sha })
        });

        if (res.ok) { alert("Terhapus!"); fetchGithubFiles(); }
    }

    window.onload = fetchGithubFiles;
</script>

</body>
  </html>
