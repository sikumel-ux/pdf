<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Mahika Cloud</title>
    <style>
        :root {
            --deep-blue: #053a6f;
            --mahika-yellow: #facc15;
            --white: #ffffff;
            --light-bg: #f3f4f6; /* Warna card */
            --text-slate: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #d1d5db; /* Background luar lebih kontras */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            text-align: center;
            background-color: var(--light-bg);
            padding: 2.5rem 1.5rem; /* Padding lebih ringkas */
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            /* Ukuran card diperkecil */
            max-width: 300px; 
            width: 80%; 
            border: 1px solid rgba(0,0,0,0.05);
        }

        .logo {
            width: 140px; /* Logo disesuaikan dengan card kecil */
            height: auto;
            margin-bottom: 1rem;
        }

        .error-code {
            font-size: 60px;
            font-weight: 800;
            margin: 0;
            color: var(--deep-blue);
        }

        .message {
            font-size: 0.95rem;
            color: var(--text-slate);
            margin: 10px 0 20px 0;
            line-height: 1.4;
        }

        .brand-footer {
            font-weight: 700;
            color: var(--mahika-yellow);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="apps.png" alt="Mahika Cloud" class="logo">
        
        <h1 class="error-code">404</h1>
        <p class="message">Halaman tidak ditemukan di sistem awan kami.</p>
        
        <div class="brand-footer">MAHIKA CLOUD</div>
    </div>

</body>
</html>
