<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Mahika Cloud</title>
    <style>
        :root {
            --deep-blue: #053a6f;
            --mahika-yellow: #facc15;
            --white: #ffffff;
            --light-bg: #f3f4f6;
            --text-slate: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--deep-blue);
        }

        .container {
            text-align: center;
            background: var(--white);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 90%;
        }

        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 80px;
            margin: 0;
            line-height: 1;
            color: var(--mahika-yellow);
        }

        p {
            font-size: 1.2rem;
            color: var(--text-slate);
            margin-top: 10px;
        }

        .brand-text {
            font-weight: bold;
            color: var(--deep-blue);
            margin-top: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="apps.png" alt="Mahika Cloud Logo" class="logo">
        <h1>404</h1>
        <p>Waduh! Halaman yang kamu cari nggak ada di awan.</p>
        <div class="brand-text">MAHIKA CLOUD</div>
    </div>
</body>
</html>
