<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahika Cloud Storage | Premium</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #0a1931;
            --gold: #ffc947;
            --bg-body: #f8fafc;
        }

        body { 
            background-color: var(--bg-body); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0;
            padding: 0;
        }

        /* --- HEADER: Dibuat lebih tinggi agar teks aman --- */
        .header-curve {
            background-color: var(--navy);
            height: 320px; /* Ditambah lagi biar lega */
            color: white;
            padding-top: 80px; /* Jarak teks dari atas layar */
            text-align: center;
            border-bottom-left-radius: 50% 40px;
            border-bottom-right-radius: 50% 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .header-curve h2 {
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            font-size: 30px;
            position: relative;
            z-index: 1;
        }

        .header-curve h2 span { color: var(--gold); }
        .header-curve p { font-size: 12px; opacity: 0.8; letter-spacing: 1px; }

        /* --- CONTAINER: Margin negatif dikurangi agar tidak "nyundul" teks --- */
        .main-container {
            margin-top: -100px; /* Diturunkan supaya tidak nabrak tulisan Mahika */
            padding-bottom: 60px;
            padding-left: 20px;
            padding-right: 20px;
            position: relative;
            z-index: 10;
        }

        .main-card { 
            background: white; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(10, 25, 49, 0.15); 
            padding: 30px 25px; 
            max-width: 480px; 
            margin: auto; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- UPLOAD ZONE --- */
        .upload-zone { 
            border: 2px dashed #e2e8f0; 
            padding: 30px 20px; 
            border-radius: 20px; 
            background: #fcfdfe; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        
        .upload-zone:hover { border-color: var(--gold); background: #fffdf5; }
        .upload-zone i { color: var(--navy); opacity: 0.7; }
        
        /* --- BUTTONS --- */
        .btn-gold {
            background-color: var(--gold);
            color: var(--navy);
            border: none;
            font-weight: 800;
            padding: 18px;
            border-radius: 20px;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(255, 201, 71, 0.3);
            width: 100%;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* --- FILE LIST --- */
        .file-row { 
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 18px; 
            margin-bottom: 12px;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border: 1px solid #f1f5f9;
        }

        .file-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .file-name { font-weight: 700; font-size: 13px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn-action {
            background: #f8fafc;
            border: none;
            color: var(--navy);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-action:hover { background-color: var(--gold); }
        #loader { display: none; }
    </style>
</head>
<body>

<div class="header-curve">
    <h2>MAHIKA <span>CLOUD</span></h2>
    <p><i class="fa-solid fa-shield-halved"></i> SECURE STORAGE SYSTEM</p>
</div>

<div class="container main-container">
    <div class="main-card">
        
        <div class="upload-zone text-center mb-4" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-cloud-arrow-up fa-3x mb-3"></i>
            <p id="fileLabel" class="mb-0 fw-bold text-muted small">Klik untuk Pilih File</p>
            <input type="file" id="fileInput" hidden onchange="updateLabel()">
        </div>

        <button class="btn btn-gold mb-4" id="uploadBtn" onclick="jalankanUpload()">
            <span id="btnText"><i class="fa-solid fa-paper-plane me-2"></i>MULAI UPLOAD</span>
            <div class="spinner-border spinner-border-sm" id="loader"></div>
        </button>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0 text-navy">Daftar Berkas</h6>
            <button class="btn btn-sm btn-light border fw-bold text-muted" onclick="muatDaftarFile()" style="font-size: 10px;">
                <i class="fa-solid fa-rotate me-1" id="refreshIcon"></i> REFRESH
            </button>
        </div>

        <div id="fileContainer">
            <p class="text-center text-muted py-4 small">Menghubungkan...</p>
        </div>
        
    </div>
    <p class="text-center mt-4 text-muted" style="font-size: 10px;">&copy; 2026 Mahika Trans Digital</p>
</div>

<script>
    // URL WEB APP GAS KAMU
    const URL_GAS = "https://script.google.com/macros/s/AKfycbw8MNPykhpLqt4r9b7dPYon9RdfZbzFRBOvx6mOmEOLCJCk3Va-iX6o1QH2f-ZtlZA/exec";

    function updateLabel() {
        const input = document.getElementById('fileInput');
        if (input.files.length > 0) {
            document.getElementById('fileLabel').innerHTML = `<span style="color:#0a1931;">${input.files[0].name}</span>`;
        }
    }

    function jalankanUpload() {
        const input = document.getElementById('fileInput');
        const btn = document.getElementById('uploadBtn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');

        if (input.files.length === 0) return alert("Pilih filenya dulu, bro!");

        btn.disabled = true;
        loader.style.display = "inline-block";
        btnText.style.display = "none";

        const file = input.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const payload = { base64: e.target.result, fileName: file.name };

            fetch(URL_GAS, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(payload)
            }).then(() => {
                alert("Upload Berhasil!");
                input.value = "";
                document.getElementById('fileLabel').innerText = "Klik untuk Pilih File";
                muatDaftarFile();
            }).finally(() => {
                btn.disabled = false;
                loader.style.display = "none";
                btnText.style.display = "inline-block";
            });
        };
        reader.readAsDataURL(file);
    }

    async function muatDaftarFile() {
        const container = document.getElementById('fileContainer');
        const refreshIcon = document.getElementById('refreshIcon');
        refreshIcon.classList.add('fa-spin');

        try {
            const response = await fetch(URL_GAS, { method: "POST", body: JSON.stringify({ action: "list" }) });
            const data = await response.json();

            if (data.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-muted small">Folder kosong.</div>`;
            } else {
                container.innerHTML = data.map(f => `
                    <div class="file-row">
                        <div class="file-info">
                            <i class="fa-solid fa-file-pdf text-danger fs-5"></i>
                            <span class="file-name">${f.name}</span>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="${f.url}" target="_blank" class="btn-action"><i class="fa-solid fa-eye"></i></a>
                            <button onclick="hapusFile('${f.id}')" class="btn-action"><i class="fa-solid fa-trash text-danger"></i></button>
                        </div>
                    </div>
                `).join('');
            }
        } catch (e) {
            container.innerHTML = `<p class="text-center text-danger small py-4">Gagal muat data.</p>`;
        } finally {
            refreshIcon.classList.remove('fa-spin');
        }
    }

    async function hapusFile(id) {
        if (!confirm("Hapus file ini?")) return;
        document.getElementById('fileContainer').style.opacity = '0.4';
        try {
            await fetch(URL_GAS, { method: "POST", body: JSON.stringify({ action: "delete", id: id }) });
            muatDaftarFile();
        } finally {
            document.getElementById('fileContainer').style.opacity = '1';
        }
    }

    window.onload = muatDaftarFile;
</script>

</body>
</html>
