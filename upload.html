<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahika Cloud | GitHub Storage</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { 
            --navy: #0a1931; 
            --gold: #ffc947; 
            --bg: #f8fafc; 
        }
        body { background-color: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }

        /* --- HEADER CURVE --- */
        .header-curve {
            background-color: var(--navy); 
            height: 320px; 
            color: white;
            padding-top: 80px; 
            text-align: center; 
            border-bottom-left-radius: 50% 40px;
            border-bottom-right-radius: 50% 40px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }
        .header-curve h2 { font-weight: 800; letter-spacing: 1.5px; font-size: 30px; }
        .header-curve h2 span { color: var(--gold); }
        .header-curve p { font-size: 12px; opacity: 0.8; letter-spacing: 1px; }

        /* --- MAIN CARD --- */
        .main-container { margin-top: -100px; padding: 0 20px 60px; position: relative; z-index: 10; }
        .main-card { 
            background: white; border-radius: 30px; padding: 30px; 
            max-width: 480px; margin: auto; box-shadow: 0 20px 50px rgba(10,25,49,0.15); 
        }

        /* --- LOGIN SECTION --- */
        #tokenSection { display: none; text-align: center; }
        .token-input { 
            border-radius: 15px; padding: 12px; border: 2px solid #e2e8f0; 
            margin-bottom: 15px; width: 100%; text-align: center; font-size: 14px;
        }

        /* --- UPLOAD SECTION --- */
        .upload-zone { 
            border: 2px dashed #e2e8f0; padding: 30px; border-radius: 20px; 
            background: #fcfdfe; cursor: pointer; transition: 0.3s; 
        }
        .upload-zone:hover { border-color: var(--gold); background: #fffdf5; }

        .btn-gold {
            background-color: var(--gold); color: var(--navy); border: none;
            font-weight: 800; padding: 18px; border-radius: 20px; width: 100%;
            box-shadow: 0 10px 25px rgba(255, 201, 71, 0.3); transition: 0.3s;
            text-transform: uppercase; font-size: 14px;
        }
        .btn-gold:active { transform: scale(0.98); }

        /* --- FILE LIST --- */
        .file-row { 
            background: white; border-radius: 18px; padding: 12px 15px; 
            margin-bottom: 12px; display: flex; align-items: center; 
            justify-content: space-between; border: 1px solid #f1f5f9;
            transition: 0.2s;
        }
        .file-row:hover { border-color: var(--gold); transform: translateY(-2px); }
        .file-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .file-name { font-weight: 700; font-size: 13px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn-action { 
            background: #f8fafc; border: none; width: 38px; height: 38px; 
            border-radius: 12px; display: inline-flex; align-items: center; 
            justify-content: center; transition: 0.2s; color: var(--navy);
        }
        .btn-action:hover { background-color: var(--gold); }
        .btn-logout { font-size: 10px; cursor: pointer; color: #ef4444; font-weight: 800; }

        #loader { display: none; }
    </style>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1931">

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log("PWA Registered, bro!"))
      .catch((err) => console.log("Gagal register PWA", err));
  }
</script>
    
</head>
<body>

<div class="header-curve">
    <h2>MAHIKA <span>FILES</span></h2>
    <p><i class="fa-brands fa-github"></i> CLOUD STORAGE SYSTEM</p>
</div>

<div class="container main-container">
    <div class="main-card">
        
        <div id="tokenSection">
            <i class="fa-solid fa-key fa-3x mb-3 text-muted"></i>
            <h5 class="fw-bold">GitHub Access Token</h5>
            <p class="small text-muted mb-4">Gunakan Token Classic dengan izin <b>'repo'</b></p>
            <input type="password" id="ghTokenInput" class="token-input" placeholder="ghp_xxxxxxxxxxxxxx">
            <button class="btn btn-gold" onclick="saveToken()">MASUK KE CLOUD</button>
        </div>

        <div id="mainContent" style="display: none;">
            <div class="upload-zone text-center mb-4" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-cloud-arrow-up fa-2x mb-2 text-muted"></i>
                <p id="fileLabel" class="mb-0 fw-bold text-muted small">Klik untuk Pilih Berkas</p>
                <input type="file" id="fileInput" hidden onchange="updateLabel()">
            </div>

            <button class="btn btn-gold mb-4" id="uploadBtn" onclick="uploadToGithub()">
                <span id="btnText"><i class="fa-solid fa-paper-plane me-2"></i>PUSH TO GITHUB</span>
                <div class="spinner-border spinner-border-sm" id="loader"></div>
            </button>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0 small text-navy">Folder /uploads</h6>
                <div>
                    <span class="btn-logout me-2" onclick="logout()">LOGOUT</span>
                    <button class="btn btn-sm btn-light border" onclick="fetchGithubFiles()">
                        <i class="fa-solid fa-rotate" id="refreshIcon"></i>
                    </button>
                </div>
            </div>

            <div id="fileListContainer">
                <p class="text-center text-muted py-4 small">Menghubungkan...</p>
            </div>
        </div>
        
    </div>
    <div class="text-center mt-4">
        <p class="text-muted" style="font-size: 10px; opacity: 0.6;">&copy; 2026 Mahika Trans Digital</p>
    </div>
</div>

<script>
    // --- KONFIGURASI KAMU ---
    const CONFIG = {
        username: "sikumel-ux",
        repo: "pdf",
        path: "uploads",
        customDomain: "files.mahikatrans.my.id"
    };

    let CURRENT_TOKEN = localStorage.getItem("gh_token");

    // CEK STATUS LOGIN
    window.onload = function() {
        if (!CURRENT_TOKEN) {
            document.getElementById('tokenSection').style.display = 'block';
        } else {
            document.getElementById('mainContent').style.display = 'block';
            fetchGithubFiles();
        }
    };

    function saveToken() {
        const input = document.getElementById('ghTokenInput').value.trim();
        if (input.startsWith('ghp_')) {
            localStorage.setItem("gh_token", input);
            location.reload();
        } else {
            alert("Token GitHub Classic harus diawali 'ghp_'");
        }
    }

    function logout() {
        if(confirm("Hapus token dan keluar?")) {
            localStorage.removeItem("gh_token");
            location.reload();
        }
    }

    function updateLabel() {
        const input = document.getElementById('fileInput');
        if (input.files[0]) document.getElementById('fileLabel').innerHTML = `<span class="text-navy">${input.files[0].name}</span>`;
    }

    // FUNGSI UPLOAD
    async function uploadToGithub() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) return alert("Pilih file dulu, bro!");

        const btn = document.getElementById('uploadBtn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');

        btn.disabled = true; loader.style.display = "inline-block"; btnText.style.display = "none";

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async () => {
            const content = reader.result.split(',')[1]; 
            const cleanName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
            const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}/${cleanName}`;

            try {
                const res = await fetch(url, {
                    method: "PUT",
                    headers: { "Authorization": `token ${CURRENT_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: `Upload: ${cleanName}`, content: content })
                });

                if (res.ok) {
                    alert("Berhasil Diunggah ke GitHub!");
                    fileInput.value = "";
                    document.getElementById('fileLabel').innerText = "Klik untuk Pilih Berkas";
                    fetchGithubFiles();
                } else {
                    const data = await res.json();
                    alert("Gagal: " + (data.message.includes("credentials") ? "Token Salah!" : data.message));
                }
            } catch (e) { alert("Error Koneksi!"); }
            finally { btn.disabled = false; loader.style.display = "none"; btnText.style.display = "inline-block"; }
        };
        reader.readAsDataURL(file);
    }

    // FUNGSI AMBIL LIST FILE + COPY LINK CUSTOM DOMAIN
    async function fetchGithubFiles() {
        const container = document.getElementById('fileListContainer');
        const refreshIcon = document.getElementById('refreshIcon');
        refreshIcon.classList.add('fa-spin');

        const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}`;

        try {
            const res = await fetch(url, { headers: { "Authorization": `token ${CURRENT_TOKEN}` } });
            
            if (res.status === 401) {
                container.innerHTML = `<p class="text-center text-danger small">Bad Credentials! Silakan Logout & Ganti Token.</p>`;
                return;
            }
            if (res.status === 404) {
                container.innerHTML = `<p class="text-center text-muted small py-4">Folder /uploads kosong.</p>`;
                return;
            }

            const data = await res.json();
            container.innerHTML = data.map(file => {
                // Link Kustom Domain kamu
                const linkDomain = `https://${CONFIG.customDomain}/${CONFIG.path}/${file.name}`;
                
                return `
                    <div class="file-row">
                        <div class="file-info">
                            <i class="fa-solid fa-file-pdf text-danger"></i>
                            <span class="file-name">${file.name}</span>
                        </div>
                        <div class="d-flex">
                            <button onclick="copyToClipboard('${linkDomain}')" class="btn-action text-primary" title="Salin Link">
                                <i class="fa-solid fa-link"></i>
                            </button>
                            <a href="${file.html_url}" target="_blank" class="btn-action mx-1" title="Lihat">
                                <i class="fa-solid fa-eye"></i>
                            </a>
                            <button onclick="deleteFile('${file.path}', '${file.sha}')" class="btn-action text-danger" title="Hapus">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (e) { container.innerHTML = `<p class="text-center text-danger small">Gagal muat data.</p>`; }
        finally { refreshIcon.classList.remove('fa-spin'); }
    }

    // FUNGSI COPY LINK
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert("Link Domain Berhasil Disalin!");
        }).catch(() => {
            alert("Gagal salin link.");
        });
    }

    // FUNGSI HAPUS
    async function deleteFile(path, sha) {
        if (!confirm("Yakin hapus file ini dari GitHub?")) return;
        const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${path}`;
        
        try {
            const res = await fetch(url, {
                method: "DELETE",
                headers: { "Authorization": `token ${CURRENT_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Delete file", sha: sha })
            });
            if (res.ok) fetchGithubFiles();
        } catch (e) { alert("Gagal hapus file."); }
    }
</script>

</body>
</html>
