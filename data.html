<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #f8f9fa; padding-top: 50px; }
      .upload-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
      #loader { display: none; }
    </style>
  </head>
  <body>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 upload-container text-center">
          <h3 class="mb-4">Upload ke Google Drive</h3>
          
          <div class="mb-3">
            <input class="form-control" type="file" id="fileInput">
          </div>

          <button class="btn btn-primary w-100" id="uploadBtn" onclick="processUpload()">
            Mulai Upload
          </button>

          <div id="loader" class="mt-3">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Mohon tunggu, sedang mengirim file...</p>
          </div>

          <div id="status" class="mt-3"></div>
        </div>
      </div>
    </div>

    <script>
      function processUpload() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('uploadBtn');

        if (fileInput.files.length === 0) {
          showStatus("Silakan pilih file dulu, bro!", "danger");
          return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        // Tampilkan loading, sembunyikan tombol
        loader.style.display = "block";
        btn.disabled = true;
        status.innerHTML = "";

        reader.onload = function(e) {
          const base64Data = e.target.result;
          
          // Memanggil fungsi di Code.gs
          google.script.run
            .withSuccessHandler(function(response) {
              loader.style.display = "none";
              btn.disabled = false;
              showStatus(response, "success");
              fileInput.value = ""; // Reset form
            })
            .withFailureHandler(function(err) {
              loader.style.display = "none";
              btn.disabled = false;
              showStatus("Gagal: " + err, "danger");
            })
            .uploadFileToDrive(base64Data, file.name);
        };

        reader.onerror = function() {
          showStatus("Gagal membaca file!", "danger");
          loader.style.display = "none";
          btn.disabled = false;
        };

        reader.readAsDataURL(file);
      }

      function showStatus(msg, type) {
        const status = document.getElementById('status');
        status.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
      }
    </script>

  </body>
</html>
