<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahika Cloud | GitHub Storage</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1931">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --navy: #0a1931; --gold: #ffc947; --bg: #f8fafc; }
        body { background-color: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }

        .header-curve {
            background-color: var(--navy); height: 180px; color: white;
            padding-top: 45px; text-align: center; border-bottom-left-radius: 50% 20px;
            border-bottom-right-radius: 50% 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }
        .header-curve h2 { font-weight: 800; letter-spacing: 1.5px; font-size: 24px; margin-bottom: 5px; }
        .header-curve h2 span { color: var(--gold); }
        .header-curve p { font-size: 10px; opacity: 0.7; letter-spacing: 1px; text-transform: uppercase; }

        .main-container { margin-top: -60px; padding: 0 20px 60px; position: relative; z-index: 10; }
        .main-card { 
            background: white; border-radius: 25px; padding: 25px; 
            max-width: 480px; margin: auto; box-shadow: 0 15px 40px rgba(10,25,49,0.1); 
        }

        #tokenSection { display: none; text-align: center; padding: 10px 0; }
        .token-input { 
            border-radius: 12px; padding: 12px; border: 2px solid #e2e8f0; 
            margin-bottom: 15px; width: 100%; text-align: center; font-size: 14px;
        }

        .upload-zone { 
            border: 2px dashed #e2e8f0; padding: 25px; border-radius: 15px; 
            background: #fcfdfe; cursor: pointer; transition: 0.3s; 
        }
        .upload-zone:hover { border-color: var(--gold); background: #fffdf5; }

        .btn-gold {
            background-color: var(--gold); color: var(--navy); border: none;
            font-weight: 800; padding: 15px; border-radius: 15px; width: 100%;
            box-shadow: 0 8px 20px rgba(255, 201, 71, 0.25); transition: 0.3s;
            text-transform: uppercase; font-size: 13px;
        }

        .file-row { 
            background: white; border-radius: 15px; padding: 10px 12px; 
            margin-bottom: 10px; display: flex; align-items: center; 
            justify-content: space-between; border: 1px solid #f1f5f9;
        }
        .file-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .file-name { font-weight: 700; font-size: 12px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn-action { 
            background: #f8fafc; border: none; width: 34px; height: 34px; 
            border-radius: 10px; display: inline-flex; align-items: center; 
            justify-content: center; transition: 0.2s; color: var(--navy); margin-left: 4px;
        }
        .btn-action:hover { background-color: var(--gold); }
        .btn-logout { font-size: 9px; cursor: pointer; color: #ef4444; font-weight: 800; text-decoration: none; }

        #loader { display: none; }
    </style>
</head>
<body>

<div class="header-curve">
    <h2>MAHIKA <span>FILES</span></h2>
    <p><i class="fa-brands fa-github"></i> Cloud Storage System</p>
</div>

<div class="container main-container">
    <div class="main-card">
        <div id="tokenSection">
            <i class="fa-solid fa-shield-halved fa-3x mb-3 text-muted"></i>
            <h5 class="fw-bold">Security Access</h5>
            <input type="password" id="ghTokenInput" class="token-input" placeholder="ghp_xxxxxxxxxxxxxx">
            <button class="btn btn-gold" onclick="saveToken()">OTORISASI</button>
        </div>

        <div id="mainContent" style="display: none;">
            <div class="upload-zone text-center mb-4" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-cloud-arrow-up fa-2x mb-2 text-muted"></i>
                <p id="fileLabel" class="mb-0 fw-bold text-muted small">Tap untuk Upload</p>
                <input type="file" id="fileInput" hidden onchange="updateLabel()">
            </div>

            <button class="btn btn-gold mb-4" id="uploadBtn" onclick="uploadToGithub()">
                <span id="btnText"><i class="fa-solid fa-bolt me-2"></i>PUSH TO CLOUD</span>
                <div class="spinner-border spinner-border-sm" id="loader"></div>
            </button>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0 small text-navy"><i class="fa-regular fa-folder-open me-1"></i> /uploads</h6>
                <div>
                    <span class="btn-logout me-2" onclick="logout()">LOGOUT</span>
                    <button class="btn btn-sm btn-light border" onclick="fetchGithubFiles()">
                        <i class="fa-solid fa-rotate" id="refreshIcon"></i>
                    </button>
                </div>
            </div>

            <div id="fileListContainer">
                <p class="text-center text-muted py-4 small">Menghubungkan...</p>
            </div>
        </div>
    </div>
    <div class="text-center mt-4">
        <p class="text-muted" style="font-size: 10px; opacity: 0.6;">&copy; 2026 Mahika Trans Digital</p>
    </div>
</div>

<script>
    const CONFIG = {
        username: "sikumel-ux",
        repo: "pdf",
        path: "uploads",
        customDomain: "files.mahikatrans.my.id"
    };

    let CURRENT_TOKEN = localStorage.getItem("gh_token");

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
        });
    }

    window.onload = function() {
        if (!CURRENT_TOKEN) {
            document.getElementById('tokenSection').style.display = 'block';
        } else {
            document.getElementById('mainContent').style.display = 'block';
            fetchGithubFiles();
        }
    };

    function saveToken() {
        const input = document.getElementById('ghTokenInput').value.trim();
        if (input.startsWith('ghp_')) {
            localStorage.setItem("gh_token", input);
            location.reload();
        } else {
            alert("Token GitHub Classic harus diawali 'ghp_'");
        }
    }

    function logout() {
        if(confirm("Hapus token dan keluar?")) {
            localStorage.removeItem("gh_token");
            location.reload();
        }
    }

    function updateLabel() {
        const input = document.getElementById('fileInput');
        if (input.files[0]) document.getElementById('fileLabel').innerHTML = `<span class="text-navy">${input.files[0].name}</span>`;
    }

    async function uploadToGithub() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) return alert("Pilih file dulu, bro!");

        const btn = document.getElementById('uploadBtn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');

        btn.disabled = true; loader.style.display = "inline-block"; btnText.style.display = "none";

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async () => {
            const content = reader.result.split(',')[1]; 
            const cleanName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
            const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}/${cleanName}`;

            try {
                const res = await fetch(url, {
                    method: "PUT",
                    headers: { "Authorization": `token ${CURRENT_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: `Upload: ${cleanName}`, content: content })
                });

                if (res.ok) {
                    alert("Berhasil!");
                    fileInput.value = "";
                    document.getElementById('fileLabel').innerText = "Tap untuk Upload";
                    fetchGithubFiles();
                } else {
                    const data = await res.json();
                    alert("Gagal: " + data.message);
                }
            } catch (e) { alert("Error!"); }
            finally { btn.disabled = false; loader.style.display = "none"; btnText.style.display = "inline-block"; }
        };
        reader.readAsDataURL(file);
    }

    // FUNGSI RENAME (COPY + DELETE)
    async function renameFile(oldPath, oldSha, oldName) {
        const newName = prompt("Masukkan nama baru (termasuk ekstensi):", oldName);
        if (!newName || newName === oldName) return;

        const cleanNewName = newName.replace(/[^a-zA-Z0-9.-]/g, '_');
        const getUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${oldPath}`;
        const putUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}/${cleanNewName}`;

        try {
            // 1. Ambil konten file lama
            const getRes = await fetch(getUrl, { headers: { "Authorization": `token ${CURRENT_TOKEN}` } });
            const fileData = await getRes.json();

            // 2. Simpan ke nama baru
            const putRes = await fetch(putUrl, {
                method: "PUT",
                headers: { "Authorization": `token ${CURRENT_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `Rename from ${oldName} to ${cleanNewName}`,
                    content: fileData.content
                })
            });

            if (putRes.ok) {
                // 3. Hapus file lama
                await fetch(getUrl, {
                    method: "DELETE",
                    headers: { "Authorization": `token ${CURRENT_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: `Cleanup after rename`, sha: oldSha })
                });
                alert("Rename Berhasil!");
                fetchGithubFiles();
            }
        } catch (e) { alert("Proses rename gagal!"); }
    }

    async function fetchGithubFiles() {
        const container = document.getElementById('fileListContainer');
        const refreshIcon = document.getElementById('refreshIcon');
        refreshIcon.classList.add('fa-spin');

        const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.path}`;

        try {
            const res = await fetch(url, { headers: { "Authorization": `token ${CURRENT_TOKEN}` } });
            if (!res.ok) {
                container.innerHTML = `<p class="text-center text-muted small py-4">Folder kosong.</p>`;
                return;
            }
            const data = await res.json();
            container.innerHTML = data.map(file => {
                const linkDomain = `https://${CONFIG.customDomain}/${CONFIG.path}/${file.name}`;
                return `
                    <div class="file-row">
                        <div class="file-info">
                            <i class="fa-solid fa-file-alt text-primary"></i>
                            <span class="file-name">${file.name}</span>
                        </div>
                        <div class="d-flex">
                            <button onclick="copyToClipboard('${linkDomain}')" class="btn-action" title="Copy">
                                <i class="fa-solid fa-copy"></i>
                            </button>
                            <button onclick="renameFile('${file.path}', '${file.sha}', '${file.name}')" class="btn-action text-warning" title="Rename">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteFile('${file.path}', '${file.sha}')" class="btn-action text-danger" title="Hapus">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (e) { container.innerHTML = `<p class="text-center text-danger small">Gagal muat data.</p>`; }
        finally { refreshIcon.classList.remove('fa-spin'); }
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => alert("Copied!")).catch(() => alert("Gagal!"));
    }

    async function deleteFile(path, sha) {
        if (!confirm("Hapus file?")) return;
        const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${path}`;
        try {
            const res = await fetch(url, {
                method: "DELETE",
                headers: { "Authorization": `token ${CURRENT_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Delete", sha: sha })
            });
            if (res.ok) fetchGithubFiles();
        } catch (e) { alert("Gagal."); }
    }
</script>

</body>
  </html>
