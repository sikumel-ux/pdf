<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahika GitHub Storage</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --navy: #0a1931; --gold: #ffc947; --bg: #f8fafc; }
        body { background-color: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }

        .header-curve {
            background-color: var(--navy); height: 320px; color: white;
            padding-top: 80px; text-align: center; border-bottom-left-radius: 50% 40px;
            border-bottom-right-radius: 50% 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .header-curve h2 span { color: var(--gold); }

        .main-container { margin-top: -120px; padding: 0 20px 60px; }
        .main-card { 
            background: white; border-radius: 30px; padding: 30px; 
            max-width: 480px; margin: auto; box-shadow: 0 20px 50px rgba(10,25,49,0.15); 
        }

        .upload-zone { 
            border: 2px dashed #e2e8f0; padding: 30px; border-radius: 20px; 
            background: #fcfdfe; cursor: pointer; transition: 0.3s; 
        }
        .upload-zone:hover { border-color: var(--gold); background: #fffdf5; }

        .btn-gold {
            background-color: var(--gold); color: var(--navy); border: none;
            font-weight: 800; padding: 18px; border-radius: 20px; width: 100%;
            box-shadow: 0 10px 25px rgba(255, 201, 71, 0.3); transition: 0.3s;
        }

        .file-row { 
            background: white; border-radius: 18px; padding: 12px 15px; 
            margin-bottom: 10px; display: flex; align-items: center; 
            justify-content: space-between; border: 1px solid #f1f5f9;
        }
        .file-name { font-weight: 700; font-size: 13px; color: var(--navy); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .btn-action { background: #f8fafc; border: none; width: 35px; height: 35px; border-radius: 10px; margin-left: 5px; }
        #loader { display: none; }
    </style>
</head>
<body>

<div class="header-curve">
    <h2>GITHUB <span>STORAGE</span></h2>
    <p><i class="fa-brands fa-github"></i> /uploads folder system</p>
</div>

<div class="container main-container">
    <div class="main-card">
        <div class="upload-zone text-center mb-4" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-file-arrow-up fa-3x mb-3 text-muted"></i>
            <p id="fileLabel" class="mb-0 fw-bold text-muted small">Pilih file untuk GitHub</p>
            <input type="file" id="fileInput" hidden onchange="updateLabel()">
        </div>

        <button class="btn btn-gold mb-4" id="uploadBtn" onclick="uploadToGithub()">
            <span id="btnText">PUSH KE REPOSITORY</span>
            <div class="spinner-border spinner-border-sm" id="loader"></div>
        </button>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0">Isi Folder /uploads</h6>
            <button class="btn btn-sm btn-light border" onclick="fetchGithubFiles()">
                <i class="fa-solid fa-rotate" id="refreshIcon"></i>
            </button>
        </div>

        <div id="fileListContainer">
            <p class="text-center text-muted py-4 small">Memuat data GitHub...</p>
        </div>
    </div>
</div>

<script>
    // --- KONFIGURASI GITHUB (ISI DI SINI) ---
    const GITHUB_CONFIG = {
        token: "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", 
        username: "sikumel-ux",
        repo: "pdf",
        path: "uploads" // Nama folder kamu
    };

    function updateLabel() {
        const input = document.getElementById('fileInput');
        if (input.files[0]) document.getElementById('fileLabel').innerText = input.files[0].name;
    }

    // FUNGSI UPLOAD KE GITHUB
    async function uploadToGithub() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) return alert("Pilih file dulu!");

        const btn = document.getElementById('uploadBtn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');

        btn.disabled = true; loader.style.display = "inline-block"; btnText.style.display = "none";

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async () => {
            const content = reader.result.split(',')[1]; // Base64 murni
            const fileName = `${Date.now()}-${file.name}`; // Tambah timestamp agar tidak bentrok
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}/${fileName}`;

            try {
                const res = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GITHUB_CONFIG.token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Upload file: ${fileName}`,
                        content: content
                    })
                });

                if (res.ok) {
                    alert("Berhasil Push ke GitHub!");
                    fileInput.value = "";
                    document.getElementById('fileLabel').innerText = "Pilih file untuk GitHub";
                    fetchGithubFiles();
                } else {
                    const err = await res.json();
                    alert("Error: " + err.message);
                }
            } catch (e) {
                alert("Gagal koneksi ke GitHub");
            } finally {
                btn.disabled = false; loader.style.display = "none"; btnText.style.display = "inline-block";
            }
        };
        reader.readAsDataURL(file);
    }

    // FUNGSI AMBIL DAFTAR FILE DARI GITHUB
    async function fetchGithubFiles() {
        const container = document.getElementById('fileListContainer');
        const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;

        try {
            const res = await fetch(url, {
                headers: { "Authorization": `token ${GITHUB_CONFIG.token}` }
            });
            const data = await res.json();

            if (!Array.isArray(data)) {
                container.innerHTML = `<p class="text-center text-muted py-4 small">Folder belum dibuat atau kosong.</p>`;
                return;
            }

            container.innerHTML = data.map(file => `
                <div class="file-row">
                    <span class="file-name">${file.name}</span>
                    <div class="d-flex">
                        <a href="${file.html_url}" target="_blank" class="btn-action text-center pt-1"><i class="fa-solid fa-eye"></i></a>
                        <button onclick="deleteGithubFile('${file.path}', '${file.sha}')" class="btn-action text-danger"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = `<p class="text-center text-danger py-4 small">Gagal memuat folder.</p>`;
        }
    }

    // FUNGSI HAPUS FILE (GitHub butuh SHA file untuk hapus)
    async function deleteGithubFile(path, sha) {
        if (!confirm("Hapus dari GitHub?")) return;
        
        const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${path}`;

        try {
            const res = await fetch(url, {
                method: "DELETE",
                headers: {
                    "Authorization": `token ${GITHUB_CONFIG.token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Hapus file via web",
                    sha: sha
                })
            });

            if (res.ok) {
                alert("File terhapus!");
                fetchGithubFiles();
            }
        } catch (e) {
            alert("Gagal hapus");
        }
    }

    window.onload = fetchGithubFiles;
</script>

</body>
</html>
