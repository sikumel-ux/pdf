<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Cloud | Mahika Trans</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #0066ff; --d: #0f172a; --bg: #f8fafc; --w: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #1e293b; padding: 20px; }
        .header { max-width: 600px; margin: 20px auto; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { font-size: 20px; font-weight: 800; }
        .header span { color: var(--p); }
        .container { max-width: 600px; margin: 0 auto; background: var(--w); border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .search-bar { position: relative; margin-bottom: 20px; }
        .search-bar i { position: absolute; left: 15px; top: 14px; color: #94a3b8; }
        .search-bar input { width: 100%; padding: 12px 15px 12px 45px; border: 1.5px solid #e2e8f0; border-radius: 12px; outline: none; transition: 0.3s; }
        .search-bar input:focus { border-color: var(--p); }
        .f-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f1f5f9; gap: 15px; transition: 0.2s; }
        .f-item:hover { background: #f8fafc; border-radius: 12px; }
        .f-icon { width: 45px; height: 45px; background: #eff6ff; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--p); font-size: 20px; }
        .f-info { flex: 1; min-width: 0; }
        .f-name { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .f-meta { font-size: 11px; color: #64748b; margin-top: 2px; }
        .f-actions { display: flex; gap: 8px; }
        .btn-act { border: none; background: #f1f5f9; width: 35px; height: 35px; border-radius: 10px; cursor: pointer; color: #64748b; transition: 0.2s; }
        .btn-act:hover { background: var(--p); color: white; }
        .loader { text-align: center; padding: 40px; color: #94a3b8; font-size: 13px; }
        .btn-refresh { background: var(--p); color: white; border: none; padding: 10px 18px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2>MAHIKA<span>DATABASE</span></h2>
        <button onclick="loadFiles()" class="btn-refresh"><i class="fa-solid fa-sync fa-spin-hover"></i> Refresh</button>
    </div>

    <div class="container">
        <div class="search-bar">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Cari nama file di cloud...">
        </div>

        <div id="fileList" class="loader">
            <i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan ke GDrive...
        </div>
    </div>

    <script>
        // PASTIKAN LINK INI ADALAH LINK .exec TERBARU KAMU
        const API_URL = "https://script.google.com/macros/s/AKfycbzqq0Q5nGjgtDMlI_36LS67gylqT_S0ZlWjT1oqSvHFapbR2P_J7UdhwDDtbJKH4lKcmg/exec";
        let allData = [];

        async function loadFiles() {
            const list = document.getElementById('fileList');
            list.innerHTML = `<div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> Sinkronisasi Data...</div>`;
            
            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "list" }) });
                allData = await res.json();
                renderFiles(allData);
            } catch (err) {
                list.innerHTML = `<div class="loader" style="color:red">Gagal terhubung ke server. Pastikan Deploy sudah "Anyone".</div>`;
            }
        }

        function renderFiles(data) {
            const list = document.getElementById('fileList');
            if (data.length === 0) {
                list.innerHTML = `<div class="loader">Tidak ada file ditemukan di folder GDrive.</div>`;
                return;
            }

            list.innerHTML = data.map(f => `
                <div class="f-item">
                    <div class="f-icon"><i class="fa-solid fa-file-pdf"></i></div>
                    <div class="f-info">
                        <span class="f-name">${f.name}</span>
                        <span class="f-meta">${(f.size/1024).toFixed(1)} KB • ID: ${f.id.substring(0,8)}...</span>
                    </div>
                    <div class="f-actions">
                        <button onclick="viewFile('${f.id}')" class="btn-act" title="Lihat"><i class="fa-solid fa-eye"></i></button>
                        <button onclick="deleteFile('${f.id}', '${f.name}')" class="btn-act" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function viewFile(id) {
            window.open(`https://drive.google.com/file/d/${id}/view`, '_blank');
        }

        async function deleteFile(id, name) {
            if (confirm(`Hapus file "${name}" secara permanen?`)) {
                try {
                    await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "delete", id: id }) });
                    alert("🗑️ Berhasil dihapus!");
                    loadFiles();
                } catch (e) { alert("Gagal menghapus."); }
            }
        }

        // Fitur Search Otomatis
        document.getElementById('searchInput').oninput = (e) => {
            const key = e.target.value.toLowerCase();
            const filtered = allData.filter(f => f.name.toLowerCase().includes(key));
            renderFiles(filtered);
        };

        // Load data saat pertama buka
        window.onload = loadFiles;
    </script>
</body>
</html>
