<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mahika Trans | Cloud Storage</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --navy: #0a1931;
            --gold: #ffc947;
            --white: #ffffff;
            --bg: #f4f7fa;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --shadow: 0 10px 25px rgba(10, 25, 49, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-dark); overflow-x: hidden; }

        /* --- Header Curve --- */
        .header {
            background-color: var(--navy);
            color: var(--white);
            padding: 50px 20px 80px;
            text-align: center;
            border-bottom-left-radius: 50% 30px;
            border-bottom-right-radius: 50% 30px;
            position: relative;
        }

        .header h1 { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
        .header h1 span { color: var(--gold); }
        .header p { font-size: 10px; opacity: 0.7; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }

        /* --- Container & Card --- */
        .container {
            max-width: 480px;
            margin: -40px auto 100px;
            padding: 0 20px;
        }

        .card {
            background: var(--white);
            border-radius: 24px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* --- Upload Zone --- */
        .upload-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 35px 20px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .upload-zone:hover { border-color: var(--gold); background: #fffdf5; }
        .upload-zone i { font-size: 40px; color: var(--navy); margin-bottom: 15px; }
        .upload-zone p { font-size: 13px; font-weight: 700; color: var(--text-light); }

        /* --- Buttons --- */
        .btn-main {
            width: 100%;
            background: var(--navy);
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 15px rgba(10, 25, 49, 0.2);
        }

        .btn-main:active { transform: scale(0.98); }
        .btn-main:disabled { background: #94a3b8; cursor: not-allowed; }

        /* --- File List --- */
        .list-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 20px;
        }

        .list-head h3 { font-size: 16px; font-weight: 800; color: var(--navy); }
        .refresh-btn { background: none; border: none; color: var(--gold); font-weight: 700; font-size: 12px; cursor: pointer; }

        #f-list { max-height: 350px; overflow-y: auto; }

        .f-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border-radius: 16px;
            margin-bottom: 10px;
            gap: 12px;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .f-item:hover { border-color: #e2e8f0; background: var(--white); }
        .f-icon { width: 40px; height: 40px; background: var(--white); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #ef4444; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .f-info { flex: 1; min-width: 0; }
        .f-name { display: block; font-size: 13px; font-weight: 700; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .f-size { font-size: 10px; color: var(--text-light); }
        
        .f-actions { display: flex; gap: 6px; }
        .btn-circle { width: 32px; height: 32px; border-radius: 10px; border: none; background: var(--white); color: var(--text-light); cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s; }
        .btn-circle:hover { background: var(--gold); color: var(--navy); }

        /* --- Navigation Bottom --- */
        .nav-bottom {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--navy);
            padding: 8px 20px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .nav-item { background: none; border: none; color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 700; cursor: pointer; padding: 8px 12px; transition: 0.3s; }
        .nav-item.active { color: var(--gold); }

        /* --- Toast --- */
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #334155;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 12px;
            transition: 0.4s;
            z-index: 9999;
        }
        .toast.show { bottom: 90px; }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>MAHIKA<span>TRANS</span></h1>
        <p>Cloud Storage</p>
    </div>

    <div class="container">
        <div class="card">
            
            <div id="v-up" style="display:none;">
                <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p id="label-file">Pilih berkas untuk diunggah</p>
                    <input type="file" id="fileInput" hidden>
                </div>
                <button class="btn-main" id="btnUpload">
                    <span id="btnText">UNGGAH SEKARANG</span>
                    <div class="spinner" id="loader"></div>
                </button>
            </div>

            <div id="v-list">
                <div class="list-head">
                    <h3>File Terimpan</h3>
                    <button onclick="loadFiles()" class="refresh-btn">
                        <i class="fa-solid fa-sync" id="syncIcon"></i> Refresh
                    </button>
                </div>
                <div id="f-list">
                    </div>
            </div>

        </div>
    </div>

    <div class="nav-bottom">
        <button onclick="changeTab('list')" id="tab-list" class="nav-item active"><i class="fa-solid fa-folder"></i><br>Berkas</button>
        <button onclick="changeTab('up')" id="tab-up" class="nav-item"><i class="fa-solid fa-plus-circle"></i><br>Tambah</button>
    </div>

    <div id="toast" class="toast">Pesan sistem</div>

    <script src="app.js"></script>
    <script>
        function changeTab(view) {
            const vList = document.getElementById('v-list'), vUp = document.getElementById('v-up');
            const tList = document.getElementById('tab-list'), tUp = document.getElementById('tab-up');

            if(view === 'up') {
                vList.style.display = 'none'; vUp.style.display = 'block';
                tList.classList.remove('active'); tUp.classList.add('active');
            } else {
                vList.style.display = 'block'; vUp.style.display = 'none';
                tList.classList.add('active'); tUp.classList.remove('active');
            }
        }
        
        // Membantu update label file saat user milih file
        document.getElementById('fileInput').addEventListener('change', function() {
            if(this.files[0]) document.getElementById('label-file').innerText = this.files[0].name;
        });
    </script>
</body>
</html>
